<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Admin — Trevqio Agency</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFBF3; --ink:#231A33; --coral:#FF6B4A; --coral-dark:#E8502F;
    --sky:#2FA9D6; --sky-tint:#E4F5FB; --sun:#FFC94A;
    --line:#EFE6D6; --ink-soft:#5B5468;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6;}
  header.site{padding:20px 28px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-size:1.15rem; font-weight:700; text-decoration:none; color:var(--ink);}
  .brand img{height:30px; width:30px; border-radius:9px; object-fit:cover;}
  .signout{font-size:0.88rem; color:var(--ink-soft); cursor:pointer; text-decoration:underline; background:none; border:none;}
  .wrap{max-width:960px; margin:0 auto; padding:48px 28px 80px;}
  h1{font-family:'Baloo 2',sans-serif; font-size:1.9rem; margin:0 0 32px;}
  .summary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:36px;}
  @media(min-width:700px){.summary-grid{grid-template-columns:repeat(5,1fr);}}
  .summary-card{background:#fff; border:2px solid var(--ink); border-radius:16px; padding:18px;}
  .summary-card .num{font-family:'Baloo 2',sans-serif; font-size:1.6rem; font-weight:700; color:var(--ink);}
  .summary-card .label{font-size:0.78rem; color:var(--ink-soft); font-weight:600; margin-top:2px;}

  .client{background:#fff; border:2px solid var(--ink); border-radius:20px; padding:26px; margin-bottom:22px;}
  .client-head{display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:baseline; margin-bottom:14px;}
  .client-head h2{font-family:'Baloo 2',sans-serif; font-size:1.1rem; margin:0;}
  .client-head .plan{font-size:0.85rem; color:var(--ink-soft);}
  .approve-row{display:flex; gap:10px;}
  .status-pill{padding:6px 14px; border-radius:100px; font-size:0.8rem; font-weight:700;}
  .status-pill.pending{background:#FFF4DC; color:#A66E2A;}
  .status-pill.declined{background:#FCEAEA; color:#D64545;}
  .details-block{background:var(--paper); border-radius:12px; padding:6px 16px; margin-bottom:16px;}
  .details-row{display:flex; gap:14px; padding:9px 0; border-top:1px solid var(--line); font-size:0.9rem;}
  .details-row:first-child{border-top:none;}
  .details-row .k{color:var(--ink-soft); font-weight:600; width:140px; flex-shrink:0;}
  .empty{color:var(--ink-soft); font-size:0.88rem; font-style:italic;}
  h3.sub{font-size:0.85rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); margin:18px 0 8px;}
  .file-list{list-style:none; padding:0; margin:0; font-size:0.9rem;}
  .file-list li{padding:6px 0; border-top:1px solid var(--line);}
  .file-list li:first-child{border-top:none;}
  .file-list a{color:var(--coral); font-weight:600;}
  .btn{display:inline-block; padding:9px 18px; border-radius:100px; font-size:0.85rem; font-weight:700; text-decoration:none; cursor:pointer; border:none; background:var(--coral); color:#fff;}
  .btn:hover{background:var(--coral-dark);}
  .btn[disabled]{opacity:0.6; cursor:default;}
  .btn-approve{background:#39AA6D;} .btn-approve:hover{background:#2E8C58;}
  .btn-decline{background:#D64545;} .btn-decline:hover{background:#B33636;}
  .record-actions{display:flex; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
  .status-select{padding:8px 12px; border-radius:10px; border:1px solid var(--line); font-size:0.85rem; background:var(--paper); font-weight:600;}
  .upload-row{display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .upload-row input[type="file"]{font-size:0.82rem;}
  .save-note{font-size:0.82rem; color:var(--ink-soft); margin-top:6px;}

  .job-box{border:1px dashed var(--line); border-radius:14px; padding:16px 18px; margin:12px 0;}
  .job-box-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .job-box-head .title{font-weight:700; font-size:0.92rem;}
  .job-box-head .date{font-size:0.78rem; color:var(--ink-soft);}

  #not-authorized{max-width:480px; margin:100px auto; text-align:center; font-size:1rem; color:var(--ink-soft);}
  #loading{color:var(--ink-soft); padding:40px 0; text-align:center;}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">
    <img src="assets/trevqio-icon.png" alt="">
    Trevqio Agency — Team
  </a>
  <div style="display:flex; align-items:center; gap:18px;">
    <a href="playbook.html" style="font-size:0.88rem; color:var(--ink-soft); text-decoration:underline;">Trial Playbook</a>
    <a href="tech-docs.html" id="tech-docs-link" style="display:none; font-size:0.88rem; color:var(--ink-soft); text-decoration:underline;">Tech Reference</a>
    <button class="signout" id="signout">Sign out</button>
  </div>
</header>

<div id="not-authorized" style="display:none;">You're not signed in as the team account, so this page isn't available to you.</div>

<div class="wrap" id="main-wrap" style="display:none;">
  <h1>Clients</h1>
  <div style="margin-bottom:24px;">
    <button class="btn" id="backup-btn" style="background:var(--sky);">Download backup now</button>
    <span id="backup-msg" style="font-size:0.85rem; color:var(--ink-soft); margin-left:10px;"></span>
  </div>

  <div class="client" id="team-section" style="display:none;">
    <h2 style="font-family:'Baloo 2',sans-serif; font-size:1.1rem; margin:0 0 14px;">Team</h2>
    <div id="team-list" style="margin-bottom:16px;"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <input type="email" id="new-admin-email" placeholder="teammate@email.com" style="padding:10px 14px; border-radius:10px; border:1px solid var(--line); font-family:'Inter',sans-serif; font-size:0.9rem; flex:1; min-width:220px;">
      <button class="btn btn-approve" id="invite-admin-btn">Invite team admin</button>
    </div>
    <p id="team-msg" style="font-size:0.85rem; color:var(--ink-soft); margin-top:8px;"></p>
  </div>

  <div class="summary-grid" id="summary-grid"></div>
  <div id="loading">Loading clients…</div>
  <div id="clients"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_EMAIL } from './supabase-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function sanitizeFilename(name){
    return name.replace(/[^a-zA-Z0-9._-]/g, '_');
  }
  const JOB_STAGES = ['Submitted','In Progress','In Review','Delivered'];
  const PLAN_NGN_PRICE = {
    'Content Starter — ₦15,000 one-time': 0,
    'Content Monthly — ₦25,000/month': 25000,
    'Social Starter — ₦40,000/month': 40000,
    'Social Growth — ₦70,000/month': 70000
  };

  let allProfiles = [];

  let currentRole = null;
  let currentUid = null;

  async function init(){
    const { data: { user } } = await supabase.auth.getUser();
    if (!user){ document.getElementById('not-authorized').style.display = 'block'; return; }
    currentUid = user.id;
    if (user.email === ADMIN_EMAIL){
      currentRole = 'super';
    } else {
      const { data: teamAdmin } = await supabase.from('team_admins').select('uid').eq('uid', user.id).maybeSingle();
      if (teamAdmin){ currentRole = 'team'; }
      else { document.getElementById('not-authorized').style.display = 'block'; return; }
    }
    document.getElementById('main-wrap').style.display = 'block';
    if (currentRole === 'super'){
      document.getElementById('team-section').style.display = 'block';
      document.getElementById('tech-docs-link').style.display = 'inline';
    }
    loadClients();
  }
  init();

  document.getElementById('invite-admin-btn').addEventListener('click', async ()=>{
    const btn = document.getElementById('invite-admin-btn');
    const msg = document.getElementById('team-msg');
    const emailInput = document.getElementById('new-admin-email');
    const email = emailInput.value.trim();
    if (!email){ msg.textContent = 'Enter an email first.'; return; }
    btn.disabled = true;
    msg.textContent = 'Sending invite…';
    const { error } = await supabase.functions.invoke('create-team-admin', { body: { email } });
    if (error){
      let detail = error.message;
      try { detail = await error.context.text(); } catch(e){}
      msg.textContent = 'Error: ' + detail;
    }
    else { msg.textContent = `Invited ${email} — they'll get an email to set their password.`; emailInput.value = ''; loadClients(); }
    btn.disabled = false;
  });

  document.getElementById('backup-btn').addEventListener('click', async ()=>{
    const btn = document.getElementById('backup-btn');
    const msg = document.getElementById('backup-msg');
    btn.disabled = true;
    msg.textContent = 'Creating backup…';
    try{
      const { data, error } = await supabase.functions.invoke('backup-export');
      if (error) throw error;
      const { data: signed } = await supabase.storage.from('backups').createSignedUrl(data.filename, 60, { download: data.filename });
      if (signed){
        const a = document.createElement('a');
        a.href = signed.signedUrl;
        a.download = data.filename;
        a.click();
      }
      msg.textContent = 'Backup downloaded.';
    }catch(err){
      msg.textContent = 'Error: ' + err.message;
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('signout').addEventListener('click', async ()=>{
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  function renderSummary(profiles, jobs){
    const totalLeads = profiles.length;
    const pending = profiles.filter(p => p.approval_status === 'Pending Review').length;
    const now = new Date();
    const activeTrials = profiles.filter(p => p.plan === '7-day free trial' && p.plan_expires_at && new Date(p.plan_expires_at) > now).length;
    const payingProfiles = profiles.filter(p => p.plan !== '7-day free trial' && p.plan_expires_at && new Date(p.plan_expires_at) > now);
    const payingClients = payingProfiles.length;
    const estRevenue = payingProfiles.reduce((sum, p) => sum + (PLAN_NGN_PRICE[p.plan] || 0), 0);

    const cards = [
      ['Total leads', totalLeads],
      ['Pending review', pending],
      ['Active trials', activeTrials],
      ['Paying clients', payingClients],
      ['Est. monthly revenue', '₦' + estRevenue.toLocaleString()]
    ];
    document.getElementById('summary-grid').innerHTML = cards.map(([label, num]) =>
      `<div class="summary-card"><div class="num">${num}</div><div class="label">${label}</div></div>`
    ).join('');
  }

  async function signedUrlsFor(bucket, files){
    if (!files || files.length === 0) return [];
    const out = [];
    for (const f of files){
      const { data } = await supabase.storage.from(bucket).createSignedUrl(f.path, 3600, { download: f.name });
      out.push({ name: f.name, url: data ? data.signedUrl : '#' });
    }
    return out;
  }

  function messagesHTML(messages){
    if (!messages || messages.length === 0) return '<p class="empty">No messages yet.</p>';
    return messages.map(m => `
      <div style="max-width:85%; padding:8px 12px; border-radius:12px; margin-bottom:8px; font-size:0.88rem; ${m.sender === 'admin' ? 'background:var(--ink); color:#fff; margin-left:auto;' : 'background:var(--paper); border:1px solid var(--line);'}">
        ${m.body}
        <div style="font-size:0.7rem; opacity:0.7; margin-top:4px;">${new Date(m.created_at).toLocaleString()}</div>
      </div>
    `).join('');
  }

  function fileListHTML(files){
    if (!files || files.length === 0) return '<p class="empty">None yet.</p>';
    return '<ul class="file-list">' + files.map(f=>`<li><a href="${f.url}" download>${f.name} — download</a></li>`).join('') + '</ul>';
  }

  function businessProfileHTML(bp){
    if (!bp || Object.keys(bp).length === 0) return '<p class="empty">Not filled in yet.</p>';
    const rows = [];
    if (bp.role) rows.push(['Role', bp.role]);
    if (bp.audience) rows.push(['Target audience', bp.audience]);
    if (bp.brandVoice && bp.brandVoice.length) rows.push(['Brand voice', bp.brandVoice.join(', ')]);
    if (bp.platforms && bp.platforms.length) rows.push(['Platforms', bp.platforms.join(', ')]);
    if (bp.avoid) rows.push(['Avoid', bp.avoid]);
    if (rows.length === 0) return '<p class="empty">Not filled in yet.</p>';
    return '<div class="details-block">' + rows.map(([k,v])=>`<div class="details-row"><span class="k">${k}</span><span>${v}</span></div>`).join('') + '</div>';
  }

  function requestHTML(request){
    if (!request) return '<p class="empty">No details.</p>';
    const rows = [];
    if (request.hasProperty === 'yes' && request.property){
      const p = request.property;
      if (p.location) rows.push(['Product / offer / project', p.location]);
      if (p.type) rows.push(['Type', p.type]);
      if (p.beds) rows.push(['Start date', p.beds]);
      if (p.baths) rows.push(['End date', p.baths]);
      if (p.features) rows.push(['Key details', p.features]);
      if (p.price) rows.push(['Price', p.price]);
      if (p.link) rows.push(['Link', p.link]);
    } else if (request.generalContent){
      rows.push(['Content requested', request.generalContent]);
    }
    if (request.needs && request.needs.length) rows.push(['Needs', request.needs.join(', ')]);
    if (rows.length === 0) return '<p class="empty">No details.</p>';
    return '<div class="details-block">' + rows.map(([k,v])=>`<div class="details-row"><span class="k">${k}</span><span>${v}</span></div>`).join('') + '</div>';
  }

  async function loadClients(){
    const clientsEl = document.getElementById('clients');
    const loading = document.getElementById('loading');
    const { data: profiles, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
    const { data: jobs } = await supabase.from('jobs').select('*').order('created_at', { ascending: false });
    const { data: featured } = await supabase.from('testimonials').select('order_uid');
    const { data: allMessages } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
    const { data: teamAdmins } = await supabase.from('team_admins').select('*').order('created_at', { ascending: true });
    const messagesByUid = {};
    (allMessages || []).forEach(m => {
      if (!messagesByUid[m.uid]) messagesByUid[m.uid] = [];
      messagesByUid[m.uid].push(m);
    });
    const featuredUids = new Set((featured || []).map(f => f.order_uid));
    loading.style.display = 'none';
    if (error){ clientsEl.innerHTML = `<p class="empty">Error loading clients: ${error.message}</p>`; return; }
    allProfiles = profiles || [];

    if (currentRole === 'super'){
      const teamListEl = document.getElementById('team-list');
      if (!teamAdmins || teamAdmins.length === 0){
        teamListEl.innerHTML = '<p class="empty">No team admins yet.</p>';
      } else {
        teamListEl.innerHTML = teamAdmins.map(ta => {
          const count = allProfiles.filter(p => p.assigned_admin === ta.uid).length;
          return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line);">
            <div><strong>${ta.email}</strong> <span style="color:var(--ink-soft); font-size:0.85rem;">— ${count} client${count===1?'':'s'} assigned</span></div>
            <button class="btn btn-decline remove-admin-btn" data-uid="${ta.uid}" style="padding:6px 14px; font-size:0.8rem;">Remove</button>
          </div>`;
        }).join('');
      }
    }

    renderSummary(allProfiles, jobs || []);
    if (allProfiles.length === 0){ clientsEl.innerHTML = '<p class="empty">No clients yet.</p>'; return; }

    clientsEl.innerHTML = '';
    for (const profile of allProfiles){
      const uid = profile.uid;
      const clientJobs = (jobs || []).filter(j => j.uid === uid);
      const clientMessages = messagesByUid[uid] || [];

      let statusControl;
      if (profile.approval_status === 'Pending Review'){
        statusControl = `
          <div class="approve-row">
            <button class="btn btn-approve approve-btn" data-uid="${uid}">Approve</button>
            <button class="btn btn-decline decline-btn" data-uid="${uid}">Decline</button>
          </div>`;
      } else if (profile.approval_status === 'Declined'){
        statusControl = `
          <div class="approve-row">
            <span class="status-pill declined">Declined</span>
            <button class="btn reconsider-btn" data-uid="${uid}" style="background:var(--ink-soft);">Reconsider</button>
          </div>`;
      } else {
        const active = profile.plan_expires_at && new Date(profile.plan_expires_at) > new Date();
        statusControl = `<span class="status-pill ${active ? '' : 'pending'}" style="${active ? 'background:#E4F5EC;color:#39AA6D;' : ''}">${active ? 'Active' : 'Not subscribed'}</span>`;
      }

      const review = profile.review || {};
      const isFeatured = featuredUids.has(uid);
      const reviewHTML = review.comment || review.rating
        ? `<div class="details-block" style="margin-bottom:10px;">${'★'.repeat(review.rating || 0)}${'☆'.repeat(5 - (review.rating || 0))}${review.comment ? ' — ' + review.comment : ''}</div>
           ${currentRole === 'super' ? `<button class="btn ${isFeatured ? '' : 'btn-approve'} feature-btn" data-uid="${uid}" data-featured="${isFeatured}" style="${isFeatured ? 'background:var(--ink-soft);' : ''}">${isFeatured ? 'Remove from homepage' : 'Feature on homepage'}</button>` : ''}`
        : '<p class="empty">No review submitted yet.</p>';

      let jobsHTML = '<p class="empty">No jobs yet.</p>';
      if (clientJobs.length){
        const jobBoxes = await Promise.all(clientJobs.map(async job=>{
          const uploadLinks = await signedUrlsFor('uploads', job.files);
          const deliverLinks = await signedUrlsFor('deliverables', job.deliverables);
          return `
            <div class="job-box">
              <div class="job-box-head">
                <div>
                  <div class="title">${(job.request && job.request.property && job.request.property.location) || 'General content'}</div>
                  <div class="date">${new Date(job.created_at).toLocaleDateString()}</div>
                </div>
                <select class="status-select job-status-select" data-job="${job.id}">
                  ${JOB_STAGES.map(s=>`<option value="${s}" ${job.status===s?'selected':''}>${s}</option>`).join('')}
                </select>
              </div>
              ${requestHTML(job.request)}
              <h3 class="sub">Client uploads</h3>
              ${fileListHTML(uploadLinks)}
              <h3 class="sub">Delivered</h3>
              ${fileListHTML(deliverLinks)}
              <div class="upload-row">
                <input type="file" data-job="${job.id}" data-uid="${uid}" class="deliver-input" multiple>
                <button class="btn deliver-btn" data-job="${job.id}" data-uid="${uid}">Upload deliverable</button>
              </div>
              <p class="save-note" data-note="${job.id}"></p>
            </div>`;
        }));
        jobsHTML = jobBoxes.join('');
      }

      const assignHTML = currentRole === 'super'
        ? `<div style="margin-top:8px;">
             <select class="assign-select" data-uid="${uid}" style="padding:6px 10px; border-radius:8px; border:1px solid var(--line); font-size:0.82rem;">
               <option value="">Unassigned</option>
               ${(teamAdmins || []).map(ta => `<option value="${ta.uid}" ${profile.assigned_admin === ta.uid ? 'selected' : ''}>${ta.email}</option>`).join('')}
             </select>
           </div>`
        : '';

      const card = document.createElement('div');
      card.className = 'client';
      card.innerHTML = `
        <div class="client-head">
          <div>
            <h2>${profile.email}</h2>
            <div class="plan">${profile.plan || 'No plan on file'}</div>
            ${profile.trial_flag ? `<div style="margin-top:6px; font-size:0.8rem; font-weight:700; color:#D64545;">⚠️ ${profile.trial_flag}</div>` : ''}
            ${assignHTML}
          </div>
          ${statusControl}
        </div>
        <h3 class="sub">Business profile</h3>
        ${businessProfileHTML(profile.business_profile)}
        <h3 class="sub">Jobs (${clientJobs.length})</h3>
        ${jobsHTML}
        <h3 class="sub">Client review</h3>
        ${reviewHTML}
        <h3 class="sub">Messages</h3>
        <div class="messages-list" id="messages-${uid}" style="max-height:260px; overflow-y:auto; margin-bottom:12px;">${messagesHTML(clientMessages)}</div>
        <div class="field">
          <textarea class="admin-message-input" data-uid="${uid}" rows="2" placeholder="Reply to this client…" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-family:'Inter',sans-serif; font-size:0.9rem;"></textarea>
        </div>
        <button class="btn send-admin-message-btn" data-uid="${uid}">Send</button>
        ${currentRole === 'super' ? `
        <div class="record-actions">
          <button class="btn edit-btn" data-uid="${uid}" style="background:var(--sky);">Edit record</button>
          <button class="btn delete-btn" data-uid="${uid}" style="background:var(--coral-dark);">Delete client record</button>
        </div>` : ''}
      `;
      clientsEl.appendChild(card);
    }

    document.querySelectorAll('.job-status-select').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        await supabase.from('jobs').update({ status: sel.value, updated_at: new Date().toISOString() }).eq('id', sel.dataset.job);
        loadClients();
      });
    });

    document.querySelectorAll('.approve-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const profile = allProfiles.find(p => p.uid === uid);
        const update = { approval_status: 'Approved', updated_at: new Date().toISOString() };
        if (profile.plan === '7-day free trial'){
          const expires = new Date();
          expires.setDate(expires.getDate() + 7);
          update.plan_expires_at = expires.toISOString();
          update.subscription_status = 'active';
        }
        await supabase.from('profiles').update(update).eq('uid', uid);
        loadClients();
      });
    });
    document.querySelectorAll('.decline-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await supabase.from('profiles').update({ approval_status: 'Declined', updated_at: new Date().toISOString() }).eq('uid', btn.dataset.uid);
        loadClients();
      });
    });
    document.querySelectorAll('.reconsider-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await supabase.from('profiles').update({ approval_status: 'Pending Review', updated_at: new Date().toISOString() }).eq('uid', btn.dataset.uid);
        loadClients();
      });
    });

    document.querySelectorAll('.feature-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const isFeatured = btn.dataset.featured === 'true';
        if (isFeatured){
          await supabase.from('testimonials').delete().eq('order_uid', uid);
        } else {
          const profile = allProfiles.find(p => p.uid === uid);
          const bp = profile.business_profile || {};
          const label = (bp.role ? bp.role + ' — ' : '') + profile.email.split('@')[0];
          await supabase.from('testimonials').insert({
            order_uid: uid,
            client_label: label,
            rating: profile.review.rating || 0,
            comment: profile.review.comment || ''
          });
        }
        loadClients();
      });
    });

    document.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const profile = allProfiles.find(p => p.uid === uid);
        const newEmail = prompt('Client email (label only — does not change their login):', profile.email);
        if (newEmail === null) return;
        const newPlan = prompt('Plan:', profile.plan || '');
        if (newPlan === null) return;
        await supabase.from('profiles').update({ email: newEmail, plan: newPlan, updated_at: new Date().toISOString() }).eq('uid', uid);
        loadClients();
      });
    });

    document.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const sure = confirm("Delete this client's record? This removes their plan, business profile, jobs, and review from your system. It does NOT delete their login — they could sign in again and land back on the plan page. This can't be undone.");
        if (!sure) return;
        await supabase.from('testimonials').delete().eq('order_uid', uid);
        await supabase.from('jobs').delete().eq('uid', uid);
        await supabase.from('profiles').delete().eq('uid', uid);
        loadClients();
      });
    });

    document.querySelectorAll('.deliver-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const jobId = btn.dataset.job;
        const uid = btn.dataset.uid;
        const input = document.querySelector(`.deliver-input[data-job="${jobId}"]`);
        const note = document.querySelector(`[data-note="${jobId}"]`);
        if (!input.files.length){ note.textContent = 'Choose a file first.'; return; }
        btn.disabled = true;
        note.textContent = 'Uploading…';
        try{
          const { data: job } = await supabase.from('jobs').select('deliverables').eq('id', jobId).single();
          const newFiles = [];
          for (const file of input.files){
            const path = `${uid}/${jobId}/${Date.now()}_${sanitizeFilename(file.name)}`;
            const { error: upErr } = await supabase.storage.from('deliverables').upload(path, file);
            if (upErr) throw upErr;
            newFiles.push({ name: file.name, path });
          }
          const merged = [...(job.deliverables || []), ...newFiles];
          const { error } = await supabase.from('jobs').update({ deliverables: merged, updated_at: new Date().toISOString() }).eq('id', jobId);
          if (error) throw error;
          note.textContent = 'Uploaded.';
          loadClients();
        }catch(err){
          note.textContent = 'Error: ' + err.message;
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll('.send-admin-message-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const textarea = document.querySelector(`.admin-message-input[data-uid="${uid}"]`);
        const body = textarea.value.trim();
        if (!body) return;
        btn.disabled = true;
        const { error } = await supabase.from('messages').insert({ uid, sender: 'admin', body });
        if (!error){ textarea.value = ''; }
        loadClients();
      });
    });

    document.querySelectorAll('.assign-select').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const uid = sel.dataset.uid;
        const assigned_admin = sel.value || null;
        const { error } = await supabase.from('profiles').update({ assigned_admin, updated_at: new Date().toISOString() }).eq('uid', uid);
        if (error) alert('Error: ' + error.message);
        loadClients();
      });
    });

    document.querySelectorAll('.remove-admin-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const sure = confirm('Remove this team admin? Their assigned clients will become unassigned, and their login will be permanently deleted.');
        if (!sure) return;
        const { error } = await supabase.functions.invoke('smart-handler', { body: { uid } });
        if (error){
          let detail = error.message;
          try { detail = await error.context.text(); } catch(e){}
          alert('Error: ' + detail);
        }
        loadClients();
      });
    });
  }
</script>

</body>
</html>
