<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Trevqio Agency</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFBF3; --ink:#231A33; --coral:#FF6B4A; --coral-dark:#E8502F;
    --sky:#2FA9D6; --sky-tint:#E4F5FB; --sun:#FFC94A;
    --line:#EFE6D6; --ink-soft:#5B5468; --red:#D64545; --red-tint:#FCEAEA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6; min-height:100vh; display:flex; flex-direction:column;}
  header.site{padding:20px 28px; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-size:1.15rem; font-weight:700; text-decoration:none; color:var(--ink);}
  .brand img{height:30px; width:30px; border-radius:9px; object-fit:cover;}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .card{width:100%; max-width:420px; background:#fff; border:2px solid var(--ink); border-radius:22px; padding:36px 32px;}
  h1{font-family:'Baloo 2',sans-serif; font-size:1.5rem; margin:0 0 8px;}
  .sub{color:var(--ink-soft); font-size:0.95rem; margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;}
  .field input{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); font-family:'Inter',sans-serif; font-size:0.95rem; background:var(--paper); color:var(--ink);}
  .field input:focus{outline:3px solid var(--sun); border-color:transparent;}
  .btn{width:100%; display:inline-block; padding:13px 24px; border-radius:100px; font-size:0.95rem; font-weight:700; text-decoration:none; cursor:pointer; border:none; background:var(--coral); color:#fff; text-align:center;}
  .btn:hover{background:var(--coral-dark);}
  .btn[disabled]{opacity:0.6; cursor:default;}
  .msg{margin-top:16px; padding:12px 14px; border-radius:12px; font-size:0.88rem; display:none;}
  .msg.error{display:block; background:var(--red-tint); color:var(--red);}
  .msg.info{display:block; background:var(--sky-tint); color:var(--ink);}
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="trevqio-theme">
/* Trevqio shared theme — matches the homepage (index.html). Loaded after each page's own <style>. */
:root{
  --bg:#111016; --surface:#191720; --surface2:#211e2b; --line:#353040;
  --text:#f7f5fb; --muted:#b4afc2; --violet:#a78bfa; --violet2:#8b5cf6; --green:#b9f3d1;
  /* legacy variable names used by the older page styles */
  --paper:#111016; --ink:#f7f5fb; --ink-soft:#b4afc2;
  --coral:#a78bfa; --coral-dark:#c4b5fd;
  --sky:#c7b6ff; --sky-tint:rgba(167,139,250,.12); --sun:#c4b5fd; --grass:#b9f3d1;
  --red:#ff8a8a; --red-tint:rgba(255,138,138,.12);
}
body{
  background:radial-gradient(circle at 92% -8%,rgba(139,92,246,.2),transparent 520px),#111016 !important;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.price,.num,.summary-card .num{font-family:Manrope,sans-serif !important; letter-spacing:-.035em; line-height:1.15;}
a{color:#d4c4ff;}
header.site{background:rgba(17,16,22,.9); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.08); position:sticky; top:0; z-index:50;}
.brand{color:var(--text); font-weight:800;}
.brand img{border-radius:10px; object-fit:contain;}
.signout{color:var(--muted);}
:focus-visible{outline:3px solid #c4b5fd; outline-offset:3px;}

/* surfaces */
.card,.client,.summary-card,.plan,.toc,.job-card,.note{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  color:var(--text);
  box-shadow:none !important;
}
.card,.client,.plan{border-radius:18px;}
.summary-card{border-radius:16px;}
.plan.featured{background:linear-gradient(160deg,#29213b,#191720 55%) !important; border-color:#8b5cf6 !important; box-shadow:0 18px 50px rgba(139,92,246,.08) !important;}
.card::before{background:#a78bfa !important; color:#151020 !important; border-radius:8px !important;}
.details-block{background:var(--bg); border:1px solid var(--line);}
.job-box,.job-body{background:transparent;}
.msg-bubble.admin{background:var(--surface2); border-color:var(--line); color:var(--text);}
.msg-bubble.client{background:#a78bfa; color:#151020;}

/* text */
p,li,.sub,.hint,.empty,.save-note,.updated,.plan-tag,.back{color:var(--muted);}
.card p,.client p,li{color:#ddd7e8;}
.plan p.desc,.card .hint{color:var(--muted);}
h2{color:var(--text);}
.wrap h2{border-color:var(--line);}
.card.prompt{background:rgba(167,139,250,.08) !important; border:1px solid #5d4a7b !important;}
.card.message{background:var(--bg) !important; border:1px dashed #5e4a7c !important;}
.plan-label{color:#d4c4ff;}
ul.checklist li::before{color:#a78bfa;}
.price span{color:var(--muted);}
.file-list a{color:#d4c4ff;}

/* forms */
input,select,textarea{background:var(--bg) !important; color:var(--text) !important; border:1px solid var(--line) !important; font-family:'DM Sans',sans-serif;}
input::placeholder,textarea::placeholder{color:#7d7790;}
input:focus,select:focus,textarea:focus{outline:none !important; border-color:#a78bfa !important; box-shadow:0 0 0 3px rgba(167,139,250,.25);}
input[type="checkbox"],input[type="radio"]{accent-color:#a78bfa;}
.field input,.field select,.field textarea{border-radius:12px;}

/* buttons: solid violet, dark text — same as the homepage */
.btn{background:#a78bfa; color:#151020 !important; border:1px solid transparent; border-radius:12px !important; font-weight:700; box-shadow:none; transition:transform .18s ease,background .18s ease;}
.btn:hover{background:#c4b5fd; transform:translateY(-2px);}
.btn[disabled]{opacity:.6; transform:none;}
a.btn{color:#151020 !important; text-decoration:none;}
.btn-ghost,.btn.btn-ghost{background:transparent !important; color:var(--text) !important; border:1px solid #51485f !important;}
.btn-ghost:hover{background:var(--surface2) !important; border-color:#7d6b9d !important;}
.btn-approve{background:#b9f3d1; color:#0f2a1c !important;}
.btn-approve:hover{background:#d3f8e3;}
.btn-decline,.btn-danger{background:#ff8a8a; color:#2a0d0d !important;}
.btn-decline:hover,.btn-danger:hover{background:#ffa3a3;}
.plan.featured .btn,.plan .btn{background:#a78bfa; color:#151020 !important;}

/* tabs / toggles */
.tabs{background:var(--bg); border:1px solid var(--line); border-radius:12px;}
.tab{color:var(--muted);}
.tab.active{background:#a78bfa !important; color:#151020 !important;}
.toggle-btn{background:var(--bg); border-color:var(--line); color:var(--muted);}
.toggle-btn.active{background:#a78bfa !important; border-color:#a78bfa !important; color:#151020 !important;}

/* status */
.status-pill{background:rgba(167,139,250,.14); color:#d4c4ff;}
.status-pill.delivered{background:rgba(185,243,209,.12) !important; color:#b9f3d1 !important;}
.status-pill.pending{background:rgba(233,199,124,.14) !important; color:#e9c77c !important;}
.status-pill.declined{background:rgba(255,138,138,.14) !important; color:#ff8a8a !important;}
.job-steps span{background:var(--line);}
.job-steps span.done{background:#b9f3d1;}
.star-btn{color:#3a3548;}
.star-btn.active{color:#e9c77c;}
.msg.error{background:var(--red-tint); color:var(--red);}
.msg.info{background:rgba(167,139,250,.12); color:var(--text);}

/* tables / code (tech docs) */
table{background:var(--surface) !important; border:1px solid var(--line) !important;}
th{background:var(--surface2) !important; color:var(--text) !important;}
td{color:#ddd7e8 !important; border-color:var(--line) !important;}
code,pre{background:var(--bg) !important; color:#d9caff !important; border:1px solid var(--line);}

footer{border-color:var(--line) !important; color:var(--muted);}
::selection{background:#a78bfa; color:#151020;}

</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">
    <img src="assets/trevqio-icon.png" alt="">
    Trevqio Agency
  </a>
</header>

<main>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="sub" id="sub-text">Enter a new password for your account.</p>

    <form id="reset-form">
      <div class="field"><label for="new-password">New password (6+ characters)</label><input id="new-password" type="password" required minlength="6"></div>
      <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" required minlength="6"></div>
      <button class="btn" type="submit">Save new password</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const msg = document.getElementById('msg');
  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg ' + type; }

  // Supabase reads the recovery token from the URL automatically.
  // Confirm we actually have a valid recovery session before letting them submit.
  let hasRecoverySession = false;
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')){
      hasRecoverySession = true;
    }
  });
  setTimeout(async ()=>{
    const { data: { session } } = await supabase.auth.getSession();
    if (session) hasRecoverySession = true;
    if (!hasRecoverySession){
      showMsg('This reset link is invalid or has expired. Go back to the login page and request a new one.', 'error');
      document.getElementById('reset-form').style.display = 'none';
    }
  }, 1200);

  document.getElementById('reset-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pw = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if (pw !== confirm){ showMsg("Passwords don't match.", 'error'); return; }
    showMsg('Saving…', 'info');
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error){ showMsg(error.message, 'error'); return; }
    showMsg('Password updated! Redirecting you to sign in…', 'info');
    await supabase.auth.signOut();
    setTimeout(()=>{ window.location.href = 'login.html'; }, 1500);
  });
</script>

</body>
</html>
