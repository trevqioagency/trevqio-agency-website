<!DOCTYPE html>
<html lang="en">
<head>
<script id="trevqio-theme-boot">(function(){var t='dark';try{t=localStorage.getItem('trevqio-theme')||'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — Trevqio Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFFBF3; --ink:#231A33; --coral:#FF6B4A; --ink-soft:#5B5468;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6;}
  .wrap{max-width:560px; margin:0 auto; padding:100px 28px; text-align:center;}
  h1{font-family:'Baloo 2',sans-serif; font-size:2.1rem; margin:0 0 16px;}
  p{color:var(--ink-soft); font-size:1.05rem; margin:0 0 28px;}
  a.btn{display:inline-block; background:var(--coral); color:#fff; text-decoration:none; padding:13px 26px; border-radius:100px; font-weight:700;}
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="trevqio-theme">
/* Trevqio shared theme — dark (default) and light. Matches the homepage. */
:root{
  --bg:#111016; --surface:#191720; --surface2:#211e2b; --line:#353040;
  --text:#f7f5fb; --muted:#b4afc2; --soft:#ddd7e8;
  --accent:#a78bfa; --accent-hover:#c4b5fd; --on-accent:#151020; --link:#d4c4ff; --label:#d4c4ff;
  --glow:rgba(139,92,246,.2); --header-bg:rgba(17,16,22,.9);
  --featured:linear-gradient(160deg,#29213b,#191720 55%); --featured-line:#8b5cf6;
  --prompt-bg:rgba(167,139,250,.08); --prompt-line:#5d4a7b; --dash-line:#5e4a7c; --btn-line:#51485f;
  --ok-bg:rgba(185,243,209,.12); --ok-fg:#b9f3d1; --warn-bg:rgba(233,199,124,.14); --warn-fg:#e9c77c;
  --bad-bg:rgba(255,138,138,.14); --bad-fg:#ff8a8a;
  --approve-bg:#b9f3d1; --approve-fg:#0f2a1c; --decline-bg:#ff8a8a; --decline-fg:#2a0d0d;
  --star-off:#3a3548; --code:#d9caff;
  /* legacy names used by the older page styles */
  --paper:var(--bg); --ink:var(--text); --ink-soft:var(--muted);
  --coral:var(--accent); --coral-dark:var(--accent-hover);
  --sky:var(--label); --sky-tint:rgba(167,139,250,.12); --sun:var(--accent-hover);
  --grass:var(--ok-fg); --red:var(--bad-fg); --red-tint:var(--bad-bg);
}
html{color-scheme:dark;}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f5fc; --surface:#ffffff; --surface2:#f1ecfb; --line:#e1d9f0;
  --text:#1b1626; --muted:#5d566b; --soft:#3a3448;
  --accent:#7c5cf0; --accent-hover:#6a47e6; --on-accent:#ffffff; --link:#6a47e6; --label:#6a47e6;
  --glow:rgba(124,92,240,.12); --header-bg:rgba(247,245,252,.92);
  --featured:linear-gradient(160deg,#efe8ff,#ffffff 60%); --featured-line:#7c5cf0;
  --prompt-bg:rgba(124,92,240,.07); --prompt-line:#cdbff2; --dash-line:#cdbff2; --btn-line:#cdbff2;
  --ok-bg:rgba(23,121,74,.12); --ok-fg:#17794a; --warn-bg:rgba(180,120,20,.12); --warn-fg:#8a5a0a;
  --bad-bg:rgba(214,69,69,.1); --bad-fg:#b32d2d;
  --approve-bg:#1f9d62; --approve-fg:#ffffff; --decline-bg:#d64545; --decline-fg:#ffffff;
  --star-off:#d9d1ea; --code:#5b3fc4;
}
body{
  background:radial-gradient(circle at 92% -8%,var(--glow),transparent 520px),var(--bg) !important;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.price,.num,.summary-card .num{font-family:Manrope,sans-serif !important; letter-spacing:-.035em; line-height:1.15;}
a{color:var(--link);}
header.site{background:var(--header-bg); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50;}
.brand{color:var(--text); font-weight:800;}
.brand img{border-radius:10px; object-fit:contain;}
.signout{color:var(--muted);}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}

/* surfaces */
.card,.client,.summary-card,.plan,.toc,.job-card,.note{
  background:var(--surface) !important; border:1px solid var(--line) !important; color:var(--text); box-shadow:none !important;
}
.card,.client,.plan{border-radius:18px;}
.summary-card{border-radius:16px;}
.plan.featured{background:var(--featured) !important; border-color:var(--featured-line) !important;}
.card::before{background:var(--accent) !important; color:var(--on-accent) !important; border-radius:8px !important;}
.details-block{background:var(--bg); border:1px solid var(--line);}
.job-box,.job-body{background:transparent;}
.msg-bubble.admin{background:var(--surface2); border-color:var(--line); color:var(--text);}
.msg-bubble.client{background:var(--accent); color:var(--on-accent);}

/* text */
p,li,.sub,.hint,.empty,.save-note,.updated,.plan-tag,.back{color:var(--muted);}
.card p,.client p,li{color:var(--soft);}
.plan p.desc,.card .hint{color:var(--muted);}
h1,h2,h3{color:var(--text);}
.wrap h2{border-color:var(--line);}
.card.prompt{background:var(--prompt-bg) !important; border:1px solid var(--prompt-line) !important;}
.card.message{background:var(--bg) !important; border:1px dashed var(--dash-line) !important;}
.plan-label{color:var(--label);}
ul.checklist li::before{color:var(--accent);}
.price span{color:var(--muted);}
.file-list a{color:var(--link);}

/* forms */
input,select,textarea{background:var(--bg) !important; color:var(--text) !important; border:1px solid var(--line) !important; font-family:'DM Sans',sans-serif;}
input::placeholder,textarea::placeholder{color:var(--muted); opacity:.7;}
input:focus,select:focus,textarea:focus{outline:none !important; border-color:var(--accent) !important; box-shadow:0 0 0 3px var(--glow);}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent);}
.field input,.field select,.field textarea{border-radius:12px;}

/* buttons */
.btn{background:var(--accent); color:var(--on-accent) !important; border:1px solid transparent; border-radius:12px !important; font-weight:700; box-shadow:none; transition:transform .18s ease,background .18s ease;}
.btn:hover{background:var(--accent-hover); transform:translateY(-2px);}
.btn[disabled]{opacity:.6; transform:none;}
a.btn{color:var(--on-accent) !important; text-decoration:none;}
.btn-ghost,.btn.btn-ghost{background:transparent !important; color:var(--text) !important; border:1px solid var(--btn-line) !important;}
.btn-ghost:hover{background:var(--surface2) !important;}
.btn-approve{background:var(--approve-bg); color:var(--approve-fg) !important;}
.btn-approve:hover{background:var(--approve-bg); filter:brightness(1.08);}
.btn-decline,.btn-danger{background:var(--decline-bg); color:var(--decline-fg) !important;}
.btn-decline:hover,.btn-danger:hover{background:var(--decline-bg); filter:brightness(1.08);}
.plan.featured .btn,.plan .btn{background:var(--accent); color:var(--on-accent) !important;}

/* tabs / toggles */
.tabs{background:var(--bg); border:1px solid var(--line); border-radius:12px;}
.tab{color:var(--muted);}
.tab.active{background:var(--accent) !important; color:var(--on-accent) !important;}
.toggle-btn{background:var(--bg); border-color:var(--line); color:var(--muted);}
.toggle-btn.active{background:var(--accent) !important; border-color:var(--accent) !important; color:var(--on-accent) !important;}

/* status */
.status-pill{background:var(--sky-tint); color:var(--label);}
.status-pill.delivered{background:var(--ok-bg) !important; color:var(--ok-fg) !important;}
.status-pill.pending{background:var(--warn-bg) !important; color:var(--warn-fg) !important;}
.status-pill.declined{background:var(--bad-bg) !important; color:var(--bad-fg) !important;}
.job-steps span{background:var(--line);}
.job-steps span.done{background:var(--ok-fg);}
.star-btn{color:var(--star-off);}
.star-btn.active{color:#e9b84a;}
.msg.error{background:var(--bad-bg); color:var(--bad-fg);}
.msg.info{background:var(--sky-tint); color:var(--text);}

/* tables / code (tech docs) */
table{background:var(--surface) !important; border:1px solid var(--line) !important;}
th{background:var(--surface2) !important; color:var(--text) !important;}
td{color:var(--soft) !important; border-color:var(--line) !important;}
code,pre{background:var(--bg) !important; color:var(--code) !important; border:1px solid var(--line);}

footer{border-color:var(--line) !important; color:var(--muted);}
::selection{background:var(--accent); color:var(--on-accent);}

/* theme switch button */
.theme-toggle{position:fixed; left:16px; bottom:16px; z-index:70; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; font-size:1.15rem; line-height:1; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.22); padding:0;}
.theme-toggle:hover{border-color:var(--accent);}

</style>
</head>
<body>
  <div class="wrap">
    <h1>Got it — thank you!</h1>
    <p>Your message is on its way to the Trevqio team. We reply from trevqioagency@gmail.com within 1–2 business days.</p>
    <a class="btn" href="index.html">Back to the homepage</a>
  </div>
<script id="trevqio-theme-toggle">(function(){var b=document.createElement('button');b.className='theme-toggle';b.type='button';function cur(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'}function paint(){var l=cur()==='light';b.textContent=l?'\u{1F319}':'☀️';b.setAttribute('aria-label',l?'Switch to dark theme':'Switch to light theme');b.title=b.getAttribute('aria-label')}b.addEventListener('click',function(){var n=cur()==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('trevqio-theme',n)}catch(e){}paint()});paint();document.body.appendChild(b)})();</script>
</body>
</html>
